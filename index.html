function getDaysRemaining(dueDateStr) {
  if (!dueDateStr) return 0;
  return Math.ceil((new Date(dueDateStr).getTime() - new Date().getTime()) / (1000 * 60 * 60 * 24));

function readLS(key, fallback) { try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : fallback; } catch { return fallback; } }

export default function App() {
  const queryParams = new URLSearchParams(window.location.search);
  const urlRestId = queryParams.get("restId") || queryParams.get("restaurantId") || "rest-101";
  const urlTable = parseInt(queryParams.get("table") || "5", 10);
  const isStaffInitial =
    window.location.pathname.toLowerCase().replace(/\/+$/, "").endsWith("/staff") ||
    queryParams.get("staff") === "true" || queryParams.get("view") === "staff";

  const [currentRestId, setCurrentRestId] = useState(urlRestId);
  const [currentTable, setCurrentTable] = useState(urlTable);
  const [restaurants, setRestaurants] = useState(DEFAULT_RESTAURANTS);
  const [currentView, setCurrentView] = useState(isStaffInitial ? "login" : "customer");

  useEffect(() => {
    const check = () => {
      const sp = new URLSearchParams(window.location.search);
      const isStaff = window.location.pathname.toLowerCase().replace(/\/+$/, "").endsWith("/staff") || sp.get("staff") === "true" || sp.get("view") === "staff";
      if (isStaff) setCurrentView("login");
    };
    check();
    window.addEventListener("popstate", check);
    return () => window.removeEventListener("popstate", check);
  }, []);

  useEffect(() => {
    if (!isFirebaseAvailable || !db) return;
    try {
      const unsub = onSnapshot(collection(db, "restaurants"), (snap) => {
        if (!snap.empty) {
          const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          setRestaurants(prev => {
            const map = new Map();
            DEFAULT_RESTAURANTS.forEach(r => map.set(r.id, r));
            prev.forEach(r => map.set(r.id, r));
            list.forEach(r => map.set(r.id, { ...map.get(r.id), ...r }));
            return Array.from(map.values());
          });
        }
      }, err => console.warn("listener:", err));
      return () => unsub();
    } catch (e) { console.warn(e); }
  }, []);

  const handleAddRestaurant = (newRest) => {
    setRestaurants(prev => {
      const exists = prev.some(r => r.id === newRest.id || (r.name && newRest.name && r.name.toLowerCase() === newRest.name.toLowerCase()));
      if (exists) return prev.map(r => (r.id === newRest.id ? { ...r, ...newRest } : r));
      return [newRest, ...prev];
    });
  };

  const handleReturnToCustomer = () => {
    if (window.location.pathname.toLowerCase().includes("/staff") || window.location.search.includes("view=staff") || window.location.search.includes("staff=true")) {
      window.history.pushState({}, "", `/?restId=${currentRestId}&table=${currentTable}`);
    }
    setCurrentView("customer");
  };

  const currentRestaurant = useMemo(() => {
    return restaurants.find(r => r.id === currentRestId) || {
      id: currentRestId, name: "Restaurant " + currentRestId, tagline: "Live Dining & QR Ordering",
      ownerPin: "111111", kitchenPin: "222222", subscriptionStatus: "ACTIVE",
      dueDate: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split("T")[0], isKitchenOpen: true
    };
  }, [restaurants, currentRestId]);

  const handleRenewSubscription = async (restId) => {
    const curr = restaurants.find(r => r.id === restId);
    const currDue = curr?.dueDate ? new Date(curr.dueDate) : new Date();
    const base = currDue > new Date() ? currDue : new Date();
    const newDue = new Date(base.getTime() + 30 * 24 * 60 * 60 * 1000).toISOString().split("T")[0];
    setRestaurants(prev => prev.map(r => r.id === restId ? { ...r, subscriptionStatus: "ACTIVE", dueDate: newDue } : r));
    if (isFirebaseAvailable && db) {
      try { await updateDoc(doc(db, "restaurants", restId), { subscriptionStatus: "ACTIVE", dueDate: newDue }); }
      catch (e) { console.warn(e); }
    }
  };

  return React.createElement("div", { className: "min-h-screen bg-stone-50 text-stone-900 font-sans antialiased selection:bg-amber-100 selection:text-amber-900" },
    currentView === "customer" && React.createElement(CustomerView, { restaurant: currentRestaurant, tableNumber: currentTable }),
    currentView === "login" && React.createElement(PinLoginModal, {
      restaurants, defaultRestId: currentRestId,
      onSuccess: (session) => {
        if (session.role === "admin") setCurrentView("admin");
        else if (session.role === "owner") { setCurrentRestId(session.restaurantId); setCurrentView("owner"); }
        else if (session.role === "kitchen") { setCurrentRestId(session.restaurantId); setCurrentView("kitchen"); }
      },
      onCancel: handleReturnToCustomer,
    }),
    currentView === "owner" && React.createElement(OwnerDashboard, { restaurant: currentRestaurant, onLogout: handleReturnToCustomer }),
    currentView === "kitchen" && React.createElement(KitchenDashboard, { restaurant: currentRestaurant, onLogout: handleReturnToCustomer }),

      restaurants, onRenew: handleRenewSubscription, onAddRestaurant: handleAddRestaurant,
      onLogout: handleReturnToCustomer, setRestaurants
    })
  );
}

function PinLoginModal({ restaurants, defaultRestId, onSuccess, onCancel }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");
  const handleDigit = (d) => { if (pin.length < 6) { setPin(p => p + d); setError(""); } };
  const handleDelete = () => { setPin(p => p.slice(0, -1)); setError(""); };
  const handleLogin = (e) => {
    if (e) e.preventDefault();
    if (pin === "999999") { onSuccess({ role: "admin" }); return; }
    const curr = restaurants.find(r => r.id === defaultRestId);
    if (curr) {
      if (curr.ownerPin === pin) { onSuccess({ role: "owner", restaurantId: curr.id }); return; }
      if (curr.kitchenPin === pin) { onSuccess({ role: "kitchen", restaurantId: curr.id }); return; }
    }
    const o = restaurants.find(r => r.ownerPin === pin);
    if (o) { onSuccess({ role: "owner", restaurantId: o.id }); return; }
    const k = restaurants.find(r => r.kitchenPin === pin);
    if (k) { onSuccess({ role: "kitchen", restaurantId: k.id }); return; }
    if (pin === "111111") { onSuccess({ role: "owner", restaurantId: "rest-101" }); return; }
    if (pin === "222222") { onSuccess({ role: "kitchen", restaurantId: "rest-101" }); return; }
    setError("Invalid PIN");
  };
  return React.createElement("div", { className: "fixed inset-0 z-50 bg-stone-950 flex items-center justify-center p-4" },

          key: i, className: `w-8 h-10 rounded-xl border flex items-center justify-center font-bold text-base font-mono ${pin[i] ? "border-amber-600 bg-amber-50 text-amber-900" : "border-stone-200 bg-stone-50"}`
        }, pin[i] ? "•" : ""))),
      error && React.createElement("p", { className: "text-[11px] text-red-600 font-bold" }, error),

        }, n)),
        React.createElement("button", { onClick: () => setPin(""), className: "py-2.5 rounded-xl bg-stone-50 text-stone-400 font-bold text-[10px]" }, "Clear"),
        React.createElement("button", { onClick: () => handleDigit("0"), className: "py-2.5 rounded-xl bg-stone-50 text-stone-800 font-bold text-base border border-stone-200" }, "0"),
        React.createElement("button", { onClick: handleDelete, className: "py-2.5 rounded-xl bg-stone-50 text-stone-600 font-bold text-sm" }, "⌫")),
