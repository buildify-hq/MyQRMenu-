function getDaysRemaining(dueDateStr) {
  if (!dueDateStr) return 0;
  const due = new Date(dueDateStr), now = new Date();
  return Math.ceil((due.getTime() - now.getTime()) / (1000 * 60 * 60 * 24));
}

// ============ MAIN APP ============
export default function App() {
  const queryParams = new URLSearchParams(window.location.search);
  const urlRestId = queryParams.get("restId") || queryParams.get("restaurantId") || "rest-101";
  const urlTable = parseInt(queryParams.get("table") || "5", 10);
  const isStaffInitial =
    window.location.pathname.toLowerCase().replace(/\/+$/, "").endsWith("/staff") ||
    queryParams.get("staff") === "true" || queryParams.get("view") === "staff";

  const [currentRestId, setCurrentRestId] = useState(urlRestId);
  const [currentTable, setCurrentTable] = useState(urlTable);
  const [restaurants, setRestaurants] = useState(DEFAULT_RESTAURANTS);
  const [currentView, setCurrentView] = useState(isStaffInitial ? "login" : "customer");
  const [userSession, setUserSession] = useState(null);

  useEffect(() => {
    const checkStaffRoute = () => {
      const sp = new URLSearchParams(window.location.search);
      const isStaff = window.location.pathname.toLowerCase().replace(/\/+$/, "").endsWith("/staff") ||
        sp.get("staff") === "true" || sp.get("view") === "staff";
      if (isStaff) setCurrentView("login");
    };
    checkStaffRoute();
    window.addEventListener("popstate", checkStaffRoute);
    return () => window.removeEventListener("popstate", checkStaffRoute);
  }, []);

  useEffect(() => {
    if (!isFirebaseAvailable || !db) return;
    try {
      const unsub = onSnapshot(collection(db, "restaurants"), (snapshot) => {
        if (!snapshot.empty) {
          const firestoreList = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
          setRestaurants((prev) => {
            const map = new Map();
            DEFAULT_RESTAURANTS.forEach((r) => map.set(r.id, r));
            prev.forEach((r) => map.set(r.id, r));
            firestoreList.forEach((r) => map.set(r.id, { ...map.get(r.id), ...r }));
            return Array.from(map.values());
          });
        }
      }, (err) => console.warn("[App] restaurants listener:", err));
      return () => unsub();
    } catch (err) { console.warn("[App] restaurants listener setup:", err); }
  }, []);

  const handleAddRestaurant = (newRest) => {
    setRestaurants((prev) => {
      const exists = prev.some((r) => r.id === newRest.id ||
        (r.name && newRest.name && r.name.toLowerCase() === newRest.name.toLowerCase()));
      if (exists) return prev.map((r) => (r.id === newRest.id ? { ...r, ...newRest } : r));
      return [newRest, ...prev];
    });
  };

  const handleReturnToCustomer = () => {
    if (window.location.pathname.toLowerCase().includes("/staff") ||
        window.location.search.includes("view=staff") ||
        window.location.search.includes("staff=true")) {
      window.history.pushState({}, "", `/?restId=${currentRestId}&table=${currentTable}`);
    }
    setCurrentView("customer");
  };

  const currentRestaurant = useMemo(() => {
    return restaurants.find((r) => r.id === currentRestId) || {
      id: currentRestId, name: "Restaurant " + currentRestId,
      tagline: "Live Dining & QR Ordering", ownerPin: "111111", kitchenPin: "222222",
      subscriptionStatus: "ACTIVE",
      dueDate: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split("T")[0],
      isKitchenOpen: true,
    };
  }, [restaurants, currentRestId]);

  const handleRenewSubscription = async (restId) => {
    const currentRest = restaurants.find((r) => r.id === restId);
    const currentDue = currentRest?.dueDate ? new Date(currentRest.dueDate) : new Date();
    const baseDate = currentDue > new Date() ? currentDue : new Date();
    const newDueDate = new Date(baseDate.getTime() + 30 * 24 * 60 * 60 * 1000).toISOString().split("T")[0];
    setRestaurants((prev) => prev.map((r) => r.id === restId ? { ...r, subscriptionStatus: "ACTIVE", dueDate: newDueDate } : r));
    if (isFirebaseAvailable && db) {
      try { await updateDoc(doc(db, "restaurants", restId), { subscriptionStatus: "ACTIVE", dueDate: newDueDate }); }
      catch (e) { console.warn("Renew Firestore:", e); }
    }
  };

  return React.createElement(
    "div",
    { className: "min-h-screen bg-stone-50 text-stone-900 font-sans antialiased selection:bg-amber-100 selection:text-amber-900" },
    currentView === "customer" && React.createElement(CustomerView, { restaurant: currentRestaurant, tableNumber: currentTable }),
    currentView === "login" && React.createElement(PinLoginModal, {
      restaurants, defaultRestId: currentRestId,
      onSuccess: (session) => {
        setUserSession(session);
        if (session.role === "admin") setCurrentView("admin");
        else if (session.role === "owner") { setCurrentRestId(session.restaurantId); setCurrentView("owner"); }
        else if (session.role === "kitchen") { setCurrentRestId(session.restaurantId); setCurrentView("kitchen"); }
      },
      onCancel: handleReturnToCustomer,
    }),
    currentView === "owner" && React.createElement(OwnerDashboard, { restaurant: currentRestaurant, onLogout: handleReturnToCustomer }),
    currentView === "kitchen" && React.createElement(KitchenDashboard, { restaurant: currentRestaurant, onLogout: handleReturnToCustomer }),
    currentView === "admin" && React.createElement(SuperAdminDashboard, {
      restaurants, onRenew: handleRenewSubscription, onAddRestaurant: handleAddRestaurant,
      onLogout: handleReturnToCustomer, setRestaurants
    })
  );
}

    isVegetarian: data.type === "veg" || Boolean(data.isVegetarian),
    tag: data.isSpecial ? "Special" : data.tag || data.seasonalTag || null,
    prepTime: data.prepTime || "15 mins",
    available: data.available !== false,
  });

  useEffect(() => {
    let unsubscribe = () => {};
    let isMounted = true;
    setLoading(true);

    const fetchViaRest = async () => {
      try {
        const res = await fetch(`https://firestore.googleapis.com/v1/projects/menu-qr-b8765/databases/(default)/documents/restaurants/${restaurantId}/menuItems`);
        const json = await res.json();
        if (isMounted) {
          if (json.documents && json.documents.length > 0) {
            const loaded = json.documents.map((d) => {
              const fields = d.fields || {};
              const id = d.name.split("/").pop();
              return mapDocToItem(id, {
                name: fields.name?.stringValue, description: fields.description?.stringValue,
                price: fields.price?.doubleValue || parseFloat(fields.price?.integerValue || 0),
                category: fields.category?.stringValue,
                image: fields.image?.stringValue || fields.imageUrl?.stringValue,
                type: fields.type?.stringValue, isSpecial: fields.isSpecial?.booleanValue,
                available: fields.available?.booleanValue !== false,
              });
            });
            setMenuItems(loaded);
          } else setMenuItems([]);
          setLoading(false);
        }
      } catch (err) { if (isMounted) { setMenuItems([]); setLoading(false); } }
    };

    if (isFirebaseAvailable && db) {
      try {
        const menuColRef = collection(db, "restaurants", restaurantId, "menuItems");
        getDocs(menuColRef).then((snap) => {
          if (!isMounted) return;
          if (!snap.empty) { setMenuItems(snap.docs.map((d) => mapDocToItem(d.id, d.data()))); setLoading(false); }
          else fetchViaRest();
        }).catch(() => fetchViaRest());
        unsubscribe = onSnapshot(menuColRef,
          (snapshot) => {
            if (!isMounted) return;
            setMenuItems(snapshot.docs.map((d) => mapDocToItem(d.id, d.data())));
            setLoading(false);
          },
          (err) => { console.warn("[CustomerView] snapshot:", err); fetchViaRest(); });
      } catch (err) { fetchViaRest(); }
    } else { fetchViaRest(); }
    return () => { isMounted = false; unsubscribe(); };
  }, [restaurantId]);

  useEffect(() => {
    if (!activeOrderId || !isFirebaseAvailable || !db) return;
    try {
      const orderRef = doc(db, "restaurants", restaurantId, "orders", activeOrderId);
      const unsubOrder = onSnapshot(orderRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          setLiveOrderStatus({ id: docSnap.id, tokenNumber: data.tokenNumber || "TB-100", status: (data.status || "PENDING").toUpperCase() });

      return () => unsubOrder();
    } catch (e) { console.warn("live tracker:", e); }

  const categories = ["All", "Veg", "Non-Veg", "Mains", "Snacks", "Drinks", "Ice Cream", "Desserts"];

      const q = searchQuery.toLowerCase();
      const matchSearch = item.name.toLowerCase().includes(q) || item.description.toLowerCase().includes(q);
      let matchCategory = true;
      if (selectedCategory === "All") matchCategory = true;
      else if (selectedCategory === "Veg") matchCategory = item.isVegetarian === true;
      else if (selectedCategory === "Non-Veg") matchCategory = item.isVegetarian === false;
      else matchCategory = item.category === selectedCategory;
      return matchCategory && matchSearch;

  const grandTotal = cartSubtotal + taxAmount;

    const existing = prev.find((i) => i.id === item.id);

    return [...prev, { ...item, qty: 1 }];

    return i;

      status: "PENDING", createdAt: new Date().toISOString(), timestamp: Date.now(),

    let orderId = "ord_" + Date.now();
    if (isFirebaseAvailable && db) {
      try {
        const docRef = await addDoc(collection(db, "restaurants", restaurantId, "orders"), orderPayload);
        orderId = docRef.id;

    const finalOrder = { id: orderId, ...orderPayload };

    setIsCartOpen(false);
    setShowSuccessModal(true);

            React.createElement(
              "div",
              { className: "flex items-center gap-1.5 text-[11px] text-stone-500 mt-0.5" },
              React.createElement("span", { className: "font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-md border border-amber-200/60" }, `Table ${tableNumber}`),
              React.createElement("span", { className: "text-stone-300" }, "•"),
              React.createElement("span", { className: "truncate max-w-[180px] font-medium" }, restaurant.tagline || "Digital Menu")
            )
          )

    // LIVE ORDER TRACKER
    liveOrderStatus && React.createElement(

function KitchenDashboard({ restaurant, onLogout }) {
  const [orders, setOrders] = useState([]);
  const [loading, setLoading] = useState(true);
  const targetRestId = (restaurant && restaurant.id) || "rest-101";

  useEffect(() => {
    let unsubscribe = () => {};
    let isMounted = true;
    setLoading(true);

    const parseOrderData = (id, data) => ({
      id,
      tokenNumber: data.tokenNumber || `TB-${id.slice(0, 4)}`,
      tableNumber: data.tableNumber || 1,
      items: Array.isArray(data.items) ? data.items : [],
      totalAmount: typeof data.totalAmount === "number" ? data.totalAmount : parseFloat(data.totalAmount) || 0,
      status: (data.status || "PENDING").toUpperCase(),
      specialInstructions: data.specialInstructions || "",
      createdAt: data.createdAt || "",
      timestamp: data.timestamp || 0,
    });

    const fetchViaRest = async () => {
      try {
        const res = await fetch(`https://firestore.googleapis.com/v1/projects/menu-qr-b8765/databases/(default)/documents/restaurants/${targetRestId}/orders`);
        const json = await res.json();
        if (isMounted && json.documents && json.documents.length > 0) {
          const loaded = json.documents.map((d) => {
            const fields = d.fields || {};
            const id = d.name.split("/").pop();
            const items = fields.items?.arrayValue?.values?.map((v) => {
              const f = v.mapValue?.fields || {};
              return { id: f.id?.stringValue || "", name: f.name?.stringValue || "Item",
                price: f.price?.doubleValue || parseFloat(f.price?.integerValue || 0) || 0,
                qty: parseInt(f.qty?.integerValue || "1", 10) };
            }) || [];
            return {
              id, tokenNumber: fields.tokenNumber?.stringValue || `TB-${id.slice(0, 4)}`,
              tableNumber: parseInt(fields.tableNumber?.integerValue || fields.tableNumber?.stringValue || "1", 10),
              items, totalAmount: fields.totalAmount?.doubleValue || parseFloat(fields.totalAmount?.integerValue || 0) || 0,
              status: (fields.status?.stringValue || "PENDING").toUpperCase(),
              specialInstructions: fields.specialInstructions?.stringValue || "",
              createdAt: fields.createdAt?.stringValue || "",
              timestamp: parseInt(fields.timestamp?.integerValue || "0", 10),
            };
          });
          loaded.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
          setOrders(loaded); setLoading(false);
        } else if (isMounted) { setOrders([]); setLoading(false); }
      } catch (err) { if (isMounted) setLoading(false); }
    };

    if (isFirebaseAvailable && db) {
      try {
        const ordersCol = collection(db, "restaurants", targetRestId, "orders");
        getDocs(ordersCol).then((snap) => {
          if (!isMounted) return;
          if (!snap.empty) {
            const loaded = snap.docs.map((d) => parseOrderData(d.id, d.data()));
            loaded.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            setOrders(loaded); setLoading(false);
          } else fetchViaRest();
        }).catch(() => fetchViaRest());
        unsubscribe = onSnapshot(ordersCol,
          (snapshot) => {
            if (!isMounted) return;
            const live = snapshot.docs.map((d) => parseOrderData(d.id, d.data()));
            live.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            setOrders(live); setLoading(false);
          },
          (err) => { console.warn("[Kitchen] snapshot:", err); fetchViaRest(); });
      } catch (err) { fetchViaRest(); }
    } else { fetchViaRest(); }

    return () => { isMounted = false; unsubscribe(); };
  }, [targetRestId]);

  const updateStatus = async (orderId, newStatus) => {
    setOrders((prev) => prev.map((o) => o.id === orderId ? { ...o, status: newStatus } : o));
    if (isFirebaseAvailable && db) {
      try {
        await updateDoc(doc(db, "restaurants", targetRestId, "orders", orderId), { status: newStatus });
      } catch (err) { console.warn("Kitchen updateDoc:", err); }
    }
  };

  const pendingOrders = orders.filter((o) => o.status === "PENDING");
  const preparingOrders = orders.filter((o) => o.status === "PREPARING");
  const completedOrders = orders.filter((o) => o.status === "COMPLETED");

function PinLoginModal({ restaurants, defaultRestId, onSuccess, onCancel }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");

  const handleDigit = (digit) => {
    if (pin.length < 6) { setPin((prev) => prev + digit); setError(""); }
  };

  const handleDelete = () => { setPin((prev) => prev.slice(0, -1)); setError(""); };

  const handleLogin = (e) => {
    if (e) e.preventDefault();
    if (pin === "999999") { onSuccess({ role: "admin" }); return; }

    const currentRest = restaurants.find((r) => r.id === defaultRestId);
    if (currentRest) {
      if (currentRest.ownerPin === pin) { onSuccess({ role: "owner", restaurantId: currentRest.id }); return; }
      if (currentRest.kitchenPin === pin) { onSuccess({ role: "kitchen", restaurantId: currentRest.id }); return; }
    }
    const ownerRest = restaurants.find((r) => r.ownerPin === pin);
    if (ownerRest) { onSuccess({ role: "owner", restaurantId: ownerRest.id }); return; }
    const kitchenRest = restaurants.find((r) => r.kitchenPin === pin);
    if (kitchenRest) { onSuccess({ role: "kitchen", restaurantId: kitchenRest.id }); return; }
    if (pin === "111111") { onSuccess({ role: "owner", restaurantId: "rest-101" }); return; }
    if (pin === "222222") { onSuccess({ role: "kitchen", restaurantId: "rest-101" }); return; }
    setError("Invalid Staff PIN code");
  };

  return React.createElement(
    "div",
    { className: "fixed inset-0 z-50 bg-stone-950/70 backdrop-blur-md flex items-center justify-center p-4 font-sans animate-fade-in" },
    React.createElement(
